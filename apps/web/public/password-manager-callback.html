<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Connect your password manager — Unlock</title>
  <p id="status" role="status">
    Return to Unlock to finish connecting your password manager.
  </p>
  <button id="copy" type="button">Copy connection result</button>
  <script>
    const responseUrl = location.href;
    const params = new URLSearchParams(location.search);
    history.replaceState(null, "", location.pathname);
    const result = {
      type: "unlock-manager-oauth",
      code: params.get("code"),
      state: params.get("state"),
      error:
        params.get("error") ||
        (!params.get("code") || !params.get("state")
          ? "invalid_response"
          : null),
    };
    const channel = new BroadcastChannel("unlock-manager-oauth");
    channel.postMessage(result);
    channel.close();
    if (window.opener) window.opener.postMessage(result, location.origin);
    document.getElementById("copy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(responseUrl);
        document.getElementById("status").textContent =
          "Copied. In Unlock, choose Finish from another browser and paste this connection result.";
      } catch {
        document.getElementById("status").textContent =
          "Clipboard access was blocked. Reconnect from the browser where Unlock is open.";
      }
    };
  </script>
</html>
