<h2>Aiko</h2>
<p>This installer places two components on your Mac:</p>
<ul>
  <li><b>Aiko Desktop</b> &mdash; the Aiko app, installed to <code>/Applications</code></li>
  <li><b>aiko CLI</b> &mdash; the command-line tool, installed to <code>/usr/local/bin/aiko</code></li>
</ul>
<p>After installation, launch Aiko from Applications, or run <code>aiko</code> from a terminal.</p>
