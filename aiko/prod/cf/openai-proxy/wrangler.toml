name = "aiko-openai-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Observability
[observability]
enabled = true
head_sampling_rate = 1

# Upstream multi-model gateway (Surplus). Override with secret/var if needed.
# API key: `wrangler secret put SURPLUS_API_KEY`
[vars]
TARGET_URL = "https://api.surplusintelligence.ai"
