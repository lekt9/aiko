name = "aiko-openai-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Observability
[observability]
enabled = true
head_sampling_rate = 1

# The only upstream. Key: `wrangler secret put CODEGRAFF_API_KEY`
[vars]
CODEGRAFF_URL = "https://gateway.codegraff.com"

# The single model id this gateway publishes, and the upstream slug it is bound
# to. Re-pointing `best` at a newer model is a change here plus a deploy — no
# client release, and every installed client follows.
BEST_MODEL = "muse-spark-1.2-contributor"
BEST_CONTEXT_WINDOW = "1048576"
