[package]
name = "xai-telegram-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Telegram Bot daemon with full channel occupancy: long-polling, typing indicators, file/voice upload, inline keyboards, contract-gated actions"

[[bin]]
name = "telegram-daemon"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
xai-grok-config = { path = "../xai-grok-config" }
