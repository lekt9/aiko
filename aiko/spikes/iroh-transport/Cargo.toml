[package]
name = "aiko-iroh-transport-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Keep this evidence spike outside Aiko's production workspace/dependency
# graph. The exact reviewed Iroh revision is pinned for reproducibility.
[workspace]

[dependencies]
iroh = { git = "https://github.com/n0-computer/iroh", rev = "f2eb930dda3779c6d852b72f3712aacd6e573ab1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

