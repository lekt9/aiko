[workspace]

[package]
name = "aiko-desktop"
version = "0.2.114"
default-run = "aiko-desktop"
description = "Native desktop interface for Aiko"
authors = ["Aiko contributors"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "aiko_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aiko-stack"
path = "src/bin/aiko_stack.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
open = "5.4.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile = "3"
