name: ci

# Pushes on every branch, not just main/master. The default branch of this
# repository is not named `main`, so a branch filter here meant the branch that
# actually ships was the one branch CI never ran on.
on:
  push:
  pull_request:
  workflow_dispatch:

# CI on this repository has been failing at job-start with "an Actions budget is
# preventing further use". Cost is therefore a correctness concern, not a
# nicety: a workflow that cannot start proves nothing. Two things follow —
# superseded runs are cancelled, and the expensive non-hermetic jobs keep the
# trigger scope they had before pushes were widened above.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to `minimum_zig_version` in build.zig.zon. Both layers' manifests
  # pin the same version; a toolchain that drifts from it is caught by
  # tests/zig-doctrine-gate.sh rather than discovered at runtime.
  ZIG_VERSION: 0.16.0

jobs:
  # ---------------------------------------------------------------------------
  # Hermetic Zig jobs. No secrets, no network beyond the toolchain download, no
  # package registries. These run on every push and every pull request.
  # ---------------------------------------------------------------------------

  zig-test:
    name: zig build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Both layers' test suites
        run: zig build test --summary all

  zig-gate:
    name: zig build gate
    # The gates are the acceptance criterion, not the unit tests: each drives
    # the public CLI from an empty directory and asserts against durable state.
    # The suite is 25 witnesses plus the self-check, several of which stand up
    # servers and replay whole agent runs, so it is the expensive half. It runs
    # on pull requests and on default-branch pushes; every other push gets
    # `zig build test` above, and the full suite also runs nightly in
    # gate-nightly.yml.
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Both layers' test suites
        run: zig build test --summary all
      - name: Runnable witnesses
        run: zig build gate --summary all

  neuron-standalone:
    name: neuron builds and tests without contract
    # The one-way dependency is architecture, not convention: neuron building
    # and testing with contract absent is the mechanical evidence that a
    # delivered system survives the interpreter being unavailable. Asserting it
    # from the root build proves nothing, because the root build has both trees
    # present. This job runs the sub-build in its own directory instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: neuron's manifest declares no dependency on contract
        # The build graph, not the prose: `neuron/build.zig` legitimately uses
        # the word "contract" in a step description, so this looks at the
        # manifest's dependency surface and at `b.dependency` calls instead.
        run: |
          if grep -qi 'contract' neuron/build.zig.zon; then
            echo "neuron/build.zig.zon names contract; the one-way direction is broken" >&2
            exit 1
          fi
          if grep -q 'b\.dependency(' neuron/build.zig; then
            echo "neuron/build.zig resolves a dependency; neuron must resolve none" >&2
            exit 1
          fi
      - name: neuron test suite, standalone
        working-directory: neuron
        run: zig build test --summary all

  smoke-cross:
    name: smoke zig cross (x86_64-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: cross compile smoke
        run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseFast --summary all

  # ---------------------------------------------------------------------------
  # Non-hermetic jobs: macOS runners, crates.io, npm, Homebrew. These keep the
  # trigger scope they had before `on: push` was widened, so widening the Zig
  # coverage above does not widen the Actions bill below.
  # ---------------------------------------------------------------------------

  installer-config:
    name: macOS installer CI/CD contract
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify macOS installer workflow and sources
        run: bash aiko/scripts/check-installer-ci.sh

  macos-installer-smoke:
    name: macOS product installer smoke
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aiko/apps/aiko-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: aiko/apps/aiko-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install protoc and frontend dependencies
        run: |
          brew install protobuf
          pnpm --dir aiko/apps/aiko-app install --frozen-lockfile
      - name: Verify desktop release version
        shell: bash
        run: |
          version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)
          app_version=$(node -p "require('./aiko/apps/aiko-app/package.json').version")
          tauri_version=$(node -p "require('./aiko/apps/aiko-app/src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/apps/aiko-app/src-tauri/Cargo.toml | head -1)
          test -n "$version" && test "$app_version" = "$version" && test "$tauri_version" = "$version" && test "$cargo_version" = "$version"
      - name: Build runtime and app bundle
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
          pnpm --dir aiko/apps/aiko-app exec tauri build --bundles app
      - name: Build and verify unsigned product installer
        working-directory: aiko
        run: |
          scripts/prep-installer.sh
          scripts/prep-installer.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-smoke
          path: |
            aiko/dist/Aiko-Installer-*.pkg
            aiko/dist/Aiko-Installer-*.pkg.zip
          if-no-files-found: error
          retention-days: 7

  cargo-check:
    name: cargo check
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 10 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: cargo check
        working-directory: aiko
        run: cargo check --all-targets --workspace

  portable-smoke:
    name: portable package smoke
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 10 || true
      - name: Build zig host
        run: zig build -Doptimize=ReleaseFast --summary all
      - name: Build cargo aiko
        working-directory: aiko
        run: cargo build --release --bin aiko
      - name: Assemble portable stack
        run: |
          . scripts/lib/aiko-env.sh
          . scripts/lib/assemble-portable.sh
          aiko_env_init
          assemble_portable_tarball
          ls -lh target/aiko-package/
          cat target/aiko-package/*/manifest.json
      - name: Verify installer
        run: |
          pkg=$(ls -d target/aiko-package/aiko-*-linux-* 2>/dev/null | head -1)
          echo "pkg=$pkg"
          test -x "$pkg/bin/aiko"
          test -f "$pkg/lib/libcontract.so" -o -f "$pkg/lib/libcontract.dylib"
          test -f "$pkg/manifest.json"
          bash "$pkg/install.sh" --help 2>&1 | head || true
