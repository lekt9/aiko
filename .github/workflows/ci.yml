name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  installer-config:
    name: macOS installer CI/CD contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify macOS installer workflow and sources
        run: bash aiko/scripts/check-installer-ci.sh

  macos-installer-smoke:
    name: macOS product installer smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aiko/apps/aiko-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: aiko/apps/aiko-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install protoc and frontend dependencies
        run: |
          brew install protobuf
          pnpm --dir aiko/apps/aiko-app install --frozen-lockfile
      - name: Verify desktop release version
        shell: bash
        run: |
          version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)
          app_version=$(node -p "require('./aiko/apps/aiko-app/package.json').version")
          tauri_version=$(node -p "require('./aiko/apps/aiko-app/src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/apps/aiko-app/src-tauri/Cargo.toml | head -1)
          test -n "$version" && test "$app_version" = "$version" && test "$tauri_version" = "$version" && test "$cargo_version" = "$version"
      - name: Build runtime and app bundle
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
          pnpm --dir aiko/apps/aiko-app exec tauri build --bundles app
      - name: Build and verify unsigned product installer
        working-directory: aiko
        run: |
          scripts/prep-installer.sh
          scripts/prep-installer.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-smoke
          path: |
            aiko/dist/Aiko-Installer-*.pkg
            aiko/dist/Aiko-Installer-*.pkg.zip
          if-no-files-found: error
          retention-days: 7

  zig-test:
    name: zig test + gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig build test
        run: zig build test --summary all
      - name: zig build gate
        run: zig build gate --summary all

  cargo-check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 10 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: cargo check
        working-directory: aiko
        run: cargo check --all-targets --workspace

  smoke-cross:
    name: smoke zig cross (x86_64-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: cross compile smoke
        run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseFast --summary all

  portable-smoke:
    name: portable package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 10 || true
      - name: Build zig host
        run: zig build -Doptimize=ReleaseFast --summary all
      - name: Build cargo aiko
        working-directory: aiko
        run: cargo build --release --bin aiko
      - name: Assemble portable stack
        run: |
          . scripts/lib/aiko-env.sh
          . scripts/lib/assemble-portable.sh
          aiko_env_init
          assemble_portable_tarball
          ls -lh target/aiko-package/
          cat target/aiko-package/*/manifest.json
      - name: Verify installer
        run: |
          pkg=$(ls -d target/aiko-package/aiko-*-linux-* 2>/dev/null | head -1)
          echo "pkg=$pkg"
          test -x "$pkg/bin/aiko"
          test -f "$pkg/lib/libcontract.so" -o -f "$pkg/lib/libcontract.dylib"
          test -f "$pkg/manifest.json"
          bash "$pkg/install.sh" --help 2>&1 | head || true
