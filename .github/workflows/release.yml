name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.114, without v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-cross:
    name: zig ${{ matrix.target }} (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            optimize: ReleaseFast
            artifact: aiko-x86_64-linux-gnu
          - target: aarch64-linux-gnu
            optimize: ReleaseFast
            artifact: aiko-aarch64-linux-gnu
          - target: x86_64-linux-musl
            optimize: ReleaseFast
            artifact: aiko-x86_64-linux-musl
          - target: aarch64-macos
            optimize: ReleaseSafe
            artifact: aiko-aarch64-macos
          - target: x86_64-macos
            optimize: ReleaseSafe
            artifact: aiko-x86_64-macos
          - target: x86_64-windows-gnu
            optimize: ReleaseSafe
            artifact: aiko-x86_64-windows-gnu.exe
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Zig target ${{ matrix.target }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} --summary all
          ls -R zig-out 2>/dev/null | head -n 100
          ls -R contract/libcontract/zig-out 2>/dev/null | head -n 100 || true
          ls -lh zig-out/bin/aiko* 2>/dev/null || ls -lh zig-out/bin/* 2>/dev/null || true
      - name: Package Zig artifact
        run: |
          set -euo pipefail
          mkdir -p dist/zig
          if [ -f zig-out/bin/aiko ]; then
            cp zig-out/bin/aiko dist/zig/${{ matrix.artifact }}
            [ -f zig-out/bin/aiko-doctor ] && cp zig-out/bin/aiko-doctor dist/zig/aiko-doctor-${{ matrix.target }} || true
          fi
          if [ -f zig-out/bin/aiko.exe ]; then
            cp zig-out/bin/aiko.exe dist/zig/${{ matrix.artifact }}
          fi
          find contract/libcontract/zig-out -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o -name "*.a" \) -exec cp -v {} dist/zig/ \; 2>/dev/null || true
          ls -lh dist/zig/ || true
          (cd dist/zig && sha256sum * > SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt)
          cat dist/zig/SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || true
          if [ -z "$(ls -A dist/zig 2>/dev/null)" ]; then
            echo "::warning::No artifacts for ${{ matrix.target }}"
            if [ "${{ matrix.allow_failure }}" != "true" ]; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zig-${{ matrix.target }}
          path: dist/zig/
          if-no-files-found: warn
          retention-days: 30

  cargo-cross:
    name: cargo ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aiko-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: aiko-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}
      - name: Install Zig (for cross linker when needed)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cross dependencies (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 20 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: Build Aiko (cargo)
        working-directory: aiko
        run: |
          cargo build --release --bin aiko --target ${{ matrix.target }}
          ls -lh target/${{ matrix.target }}/release/aiko* 2>/dev/null | head -n 20
          ls -lh ../target/${{ matrix.target }}/release/aiko* 2>/dev/null | head -n 20 || true
          target/${{ matrix.target }}/release/aiko --version 2>/dev/null || ../target/${{ matrix.target }}/release/aiko --version 2>/dev/null || true
      - name: Package cargo artifact
        run: |
          set -euo pipefail
          mkdir -p dist/cargo
          for cand in aiko/target/${{ matrix.target }}/release/aiko target/${{ matrix.target }}/release/aiko; do
            if [ -f "$cand" ]; then
              cp -v "$cand" "dist/cargo/${{ matrix.artifact }}"
              break
            fi
          done
          if ls dist/cargo/* >/dev/null 2>&1; then
            (cd dist/cargo && sha256sum * > SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt)
          fi
          ls -lh dist/cargo/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-${{ matrix.target }}
          path: dist/cargo/
          if-no-files-found: warn
          retention-days: 30

  portable:
    name: portable stack
    runs-on: ubuntu-latest
    needs: [zig-cross]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 5 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: Build Zig (host)
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          ls -lh zig-out/bin/aiko* contract/libcontract/zig-out/lib/* 2>/dev/null | head -n 30
      - name: Build Aiko (cargo release)
        working-directory: aiko
        run: |
          cargo build --release --bin aiko
          # Swatinem cache uses aiko/target as target-dir; cargo may also use ../target depending on runner.
          ls -lh target/release/aiko 2>/dev/null || ls -lh ../target/release/aiko 2>/dev/null || ls -lh cargo/target/release/aiko 2>/dev/null || true
          (./target/release/aiko --version 2>/dev/null || ../target/release/aiko --version 2>/dev/null || target/release/aiko --version 2>/dev/null) || true
      - name: Assemble portable stack
        run: |
          set -euo pipefail
          . scripts/lib/aiko-env.sh
          . scripts/lib/assemble-portable.sh
          aiko_env_init
          # cargo with workspaces "aiko -> target" still writes to aiko/target when cwd=aiko
          for cand in aiko/target/release/aiko target/release/aiko aiko/aiko/target/release/aiko; do
            if [ -x "$cand" ]; then export AIKO_PORTABLE_AIKO_BIN="$cand"; echo "AIKO_PORTABLE_AIKO_BIN=$cand"; break; fi
          done
          ls -lh "${AIKO_PORTABLE_AIKO_BIN:-missing}" 2>/dev/null || true
          assemble_portable_tarball
          ls -lh target/aiko-package/ 2>/dev/null | head -n 40
          cat target/aiko-package/*/manifest.json 2>/dev/null | head -n 80 || true
          echo "--- also check aiko/target ---"
          ls -lh aiko/target/aiko-package/ 2>/dev/null | head -n 20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-x86_64
          path: |
            target/aiko-package/*.tar.gz
            target/aiko-package/*/manifest.json
            aiko/target/aiko-package/*.tar.gz
            aiko/target/aiko-package/*/manifest.json
          if-no-files-found: warn
          retention-days: 30

  # Desktop installers are built natively. Each job normalizes versioned Tauri
  # output to a stable name so /releases/latest/download URLs do not change.
  desktop-linux:
    name: desktop Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aiko/apps/desktop/package-lock.json
      - name: Set and verify desktop release version
        env:
          AIKO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          AIKO_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: node aiko/apps/desktop/scripts/set-release-version.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: aiko/apps/desktop
        run: |
          npm ci
          npm run frontend:ensure
          npm --prefix ../frontend/frontend ci
      - name: Build runtime and contract
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
      - name: Prepare runtime
        working-directory: aiko/apps/desktop
        run: node scripts/prepare-runtime.mjs
      - name: Build Linux bundles
        working-directory: aiko/apps/desktop
        run: npm run tauri build -- --bundles appimage,deb
      - name: Normalize Linux assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t appimages < <(find aiko/target aiko/apps/desktop/src-tauri/target -type f -name '*.AppImage' 2>/dev/null | sort)
          mapfile -t debs < <(find aiko/target aiko/apps/desktop/src-tauri/target -type f -name '*.deb' 2>/dev/null | sort)
          test "${#appimages[@]}" -gt 0 || { echo 'Expected an AppImage, but Tauri produced none' >&2; exit 1; }
          test "${#debs[@]}" -gt 0 || { echo 'Expected a deb, but Tauri produced none' >&2; exit 1; }
          cp "${appimages[0]}" release-assets/Aiko-Linux-x86_64.AppImage
          cp "${debs[0]}" release-assets/Aiko-Linux-x86_64.deb
          test -s release-assets/Aiko-Linux-x86_64.AppImage
          test -s release-assets/Aiko-Linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  desktop-macos:
    name: desktop macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aiko/apps/desktop/package-lock.json
      - name: Set and verify desktop release version
        env:
          AIKO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          AIKO_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: node aiko/apps/desktop/scripts/set-release-version.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install protoc
        run: brew install protobuf
      - name: Install frontend dependencies
        working-directory: aiko/apps/desktop
        run: |
          npm ci
          npm run frontend:ensure
          npm --prefix ../frontend/frontend ci
      - name: Build runtime and contract
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
      - name: Prepare runtime
        working-directory: aiko/apps/desktop
        run: node scripts/prepare-runtime.mjs
      - name: Build macOS DMG
        working-directory: aiko/apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          validate_group() {
            local label="$1"; shift
            local present=0
            for name in "$@"; do
              test -n "${!name:-}" && present=$((present + 1))
            done
            if test "$present" -ne 0 && test "$present" -ne "$#"; then
              echo "$label secrets must be configured all-or-none" >&2
              exit 1
            fi
            if test "$present" -eq 0; then
              for name in "$@"; do unset "$name"; done
            fi
          }
          validate_group "Apple certificate" APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          validate_group "Apple notarization" APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          npm run tauri build -- --bundles dmg
      - name: Normalize macOS asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          dmg=$(find aiko/target aiko/apps/desktop/src-tauri/target -type f -name '*.dmg' 2>/dev/null | sort | head -n 1)
          test -n "$dmg" || { echo 'Expected a DMG, but Tauri produced none' >&2; exit 1; }
          cp "$dmg" release-assets/Aiko-macOS.dmg
          test -s release-assets/Aiko-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  desktop-windows:
    name: desktop Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aiko/apps/desktop/package-lock.json
      - name: Set and verify desktop release version
        env:
          AIKO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          AIKO_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: node aiko/apps/desktop/scripts/set-release-version.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc --yes
          protoc --version
      - name: Install frontend dependencies
        working-directory: aiko/apps/desktop
        shell: pwsh
        run: |
          npm ci
          npm run frontend:ensure
          npm --prefix ../frontend/frontend ci
      - name: Build runtime and contract
        shell: pwsh
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
      - name: Prepare runtime
        working-directory: aiko/apps/desktop
        shell: pwsh
        run: |
          $env:TAURI_ENV_TARGET_TRIPLE = "x86_64-pc-windows-msvc"
          node scripts/prepare-runtime.mjs
      - name: Build Windows MSI and NSIS installers
        working-directory: aiko/apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $keyPresent = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          $passwordPresent = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if ($keyPresent -ne $passwordPresent) { throw "Tauri updater signing key and password must be configured together" }
          if (-not $keyPresent) {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npm run tauri build -- --bundles msi,nsis
      - name: Build portable and script installer archives
        working-directory: aiko/apps/desktop
        shell: pwsh
        run: node scripts/package-windows.mjs
      - name: Normalize Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $msi = Get-ChildItem -Recurse -File aiko/target,aiko/apps/desktop/src-tauri/target -Filter *.msi -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -First 1
          $setup = Get-ChildItem -Recurse -File aiko/target,aiko/apps/desktop/src-tauri/target -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Sort-Object FullName | Select-Object -First 1
          if (-not $msi) { throw "Expected an MSI, but Tauri produced none" }
          if (-not $setup) { throw "Expected an NSIS setup executable, but Tauri produced none" }
          Copy-Item $msi.FullName release-assets/Aiko-Windows-x86_64.msi
          Copy-Item $setup.FullName release-assets/Aiko-Windows-x86_64-Setup.exe
          Copy-Item aiko/dist/windows-x86_64/Aiko-Windows-x86_64-Portable.zip release-assets/
          Copy-Item aiko/dist/windows-x86_64/Aiko-Windows-x86_64-Installer.zip release-assets/
          $expected = @(
            'Aiko-Windows-x86_64.msi',
            'Aiko-Windows-x86_64-Setup.exe',
            'Aiko-Windows-x86_64-Portable.zip',
            'Aiko-Windows-x86_64-Installer.zip'
          )
          foreach ($name in $expected) {
            $asset = Join-Path release-assets $name
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -eq 0) { throw "Missing or empty release asset: $name" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [zig-cross, cargo-cross, portable, desktop-linux, desktop-macos, desktop-windows]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download required desktop assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Download optional Zig CLI assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: zig-*
          path: legacy-assets/zig
          merge-multiple: true
      - name: Download optional Cargo CLI assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: cargo-*
          path: legacy-assets/cargo
          merge-multiple: true
      - name: Download optional portable CLI assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: legacy-assets/portable
          merge-multiple: true
      - name: Stage, verify, and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' source; do
            name=$(basename "$source")
            case "$name" in
              aiko-*|*.tar.gz|manifest.json|SHA256SUMS-*.txt)
                destination="release-assets/$name"
                if test -e "$destination" && ! cmp -s "$source" "$destination"; then
                  echo "Conflicting legacy release assets named $name" >&2
                  exit 1
                fi
                cp "$source" "$destination"
                ;;
            esac
          done < <(find legacy-assets -type f -print0 2>/dev/null || true)
          expected=(
            Aiko-Linux-x86_64.AppImage
            Aiko-Linux-x86_64.deb
            Aiko-macOS.dmg
            Aiko-Windows-x86_64.msi
            Aiko-Windows-x86_64-Setup.exe
            Aiko-Windows-x86_64-Portable.zip
            Aiko-Windows-x86_64-Installer.zip
          )
          for name in "${expected[@]}"; do
            test -s "release-assets/$name" || { echo "Missing or empty required desktop asset: $name" >&2; exit 1; }
          done
          mapfile -t files < <(find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort)
          test "${#files[@]}" -ge "${#expected[@]}"
          (cd release-assets && sha256sum -- "${files[@]}" > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
