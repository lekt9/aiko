name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.114, without v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-cross:
    name: zig ${{ matrix.target }} (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            optimize: ReleaseFast
            artifact: aiko-x86_64-linux-gnu
          - target: aarch64-linux-gnu
            optimize: ReleaseFast
            artifact: aiko-aarch64-linux-gnu
          - target: x86_64-linux-musl
            optimize: ReleaseFast
            artifact: aiko-x86_64-linux-musl
          - target: aarch64-macos
            optimize: ReleaseSafe
            artifact: aiko-aarch64-macos
          - target: x86_64-macos
            optimize: ReleaseSafe
            artifact: aiko-x86_64-macos
          - target: x86_64-windows-gnu
            optimize: ReleaseSafe
            artifact: aiko-x86_64-windows-gnu.exe
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Zig target ${{ matrix.target }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} --summary all
          ls -R zig-out 2>/dev/null | head -n 100
          ls -R contract/libcontract/zig-out 2>/dev/null | head -n 100 || true
          ls -lh zig-out/bin/aiko* 2>/dev/null || ls -lh zig-out/bin/* 2>/dev/null || true
      - name: Package Zig artifact
        run: |
          set -euo pipefail
          mkdir -p dist/zig
          if [ -f zig-out/bin/aiko ]; then
            cp zig-out/bin/aiko dist/zig/${{ matrix.artifact }}
            [ -f zig-out/bin/aiko-doctor ] && cp zig-out/bin/aiko-doctor dist/zig/aiko-doctor-${{ matrix.target }} || true
          fi
          if [ -f zig-out/bin/aiko.exe ]; then
            cp zig-out/bin/aiko.exe dist/zig/${{ matrix.artifact }}
          fi
          if [ -f neuron/zig-out/bin/neuron ]; then
            cp neuron/zig-out/bin/neuron dist/zig/neuron-${{ matrix.target }}
          elif [ -f neuron/zig-out/bin/neuron.exe ]; then
            cp neuron/zig-out/bin/neuron.exe dist/zig/neuron-${{ matrix.target }}.exe
          fi
          find contract/libcontract/zig-out -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o -name "*.a" \) -exec cp -v {} dist/zig/ \; 2>/dev/null || true
          ls -lh dist/zig/ || true
          (cd dist/zig && sha256sum * > SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt)
          cat dist/zig/SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || true
          if [ -z "$(ls -A dist/zig 2>/dev/null)" ]; then
            echo "::warning::No artifacts for ${{ matrix.target }}"
            if [ "${{ matrix.allow_failure }}" != "true" ]; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zig-${{ matrix.target }}
          path: dist/zig/
          if-no-files-found: warn
          retention-days: 30

  cargo-cross:
    name: cargo ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aiko-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: aiko-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}
      - name: Install Zig (for cross linker when needed)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cross dependencies (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
          shared-key: cargo-${{ matrix.target }}
      - name: Build Aiko (cargo)
        working-directory: aiko
        run: |
          cargo build --release --bin aiko --target ${{ matrix.target }}
          ls -lh target/${{ matrix.target }}/release/aiko* 2>/dev/null | head -n 20
          ls -lh ../target/${{ matrix.target }}/release/aiko* 2>/dev/null | head -n 20 || true
          target/${{ matrix.target }}/release/aiko --version 2>/dev/null || ../target/${{ matrix.target }}/release/aiko --version 2>/dev/null || true
      - name: Package cargo artifact
        run: |
          set -euo pipefail
          mkdir -p dist/cargo
          for cand in aiko/target/${{ matrix.target }}/release/aiko target/${{ matrix.target }}/release/aiko; do
            if [ -f "$cand" ]; then
              cp -v "$cand" "dist/cargo/${{ matrix.artifact }}"
              break
            fi
          done
          if ls dist/cargo/* >/dev/null 2>&1; then
            (cd dist/cargo && sha256sum * > SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt)
          fi
          ls -lh dist/cargo/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-${{ matrix.target }}
          path: dist/cargo/
          if-no-files-found: warn
          retention-days: 30

  # Portable archives are built natively so the installer can load-test the
  # Contract ABI before publication. Zig, Rust, and pip exist only in CI; the
  # resulting archive contains Aiko, Neuron, Contract, Cell, and vendored YAML.
  portable:
    name: portable ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-13
            platform: macos-x86_64
          - runner: macos-14
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          else
            brew install protobuf
          fi
          python3 -m pip install --target "$RUNNER_TEMP/cell-vendor" "PyYAML==6.0.2"
      - name: Verify native runner target
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) actual=linux-x86_64 ;;
            Linux-aarch64|Linux-arm64) actual=linux-aarch64 ;;
            Darwin-x86_64) actual=macos-x86_64 ;;
            Darwin-arm64|Darwin-aarch64) actual=macos-aarch64 ;;
            *) echo "Unsupported native runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          test "$actual" = "${{ matrix.platform }}" || {
            echo "Runner produced $actual, expected ${{ matrix.platform }}" >&2
            exit 1
          }
      - name: Build release inputs
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
      - name: Assemble and prove the no-build archive
        shell: bash
        run: |
          set -euo pipefail
          . scripts/lib/aiko-env.sh
          . scripts/lib/assemble-portable.sh
          aiko_env_init
          export AIKO_PORTABLE_AIKO_BIN="$GITHUB_WORKSPACE/aiko/target/release/aiko"
          export AIKO_PORTABLE_NEURON_BIN="$GITHUB_WORKSPACE/neuron/zig-out/bin/neuron"
          export AIKO_PORTABLE_LIMBS_DIR="$GITHUB_WORKSPACE/neuron/limbs"
          export AIKO_PORTABLE_CELL_DIR="$GITHUB_WORKSPACE/cell"
          export AIKO_PORTABLE_YAML_DIR="$RUNNER_TEMP/cell-vendor/yaml"
          if [[ "${{ runner.os }}" == macOS ]]; then
            export AIKO_PORTABLE_CONTRACT_LIB="$GITHUB_WORKSPACE/contract/libcontract/zig-out/lib/libcontract.dylib"
          else
            export AIKO_PORTABLE_CONTRACT_LIB="$GITHUB_WORKSPACE/contract/libcontract/zig-out/lib/libcontract.so"
          fi
          test -x "$AIKO_PORTABLE_AIKO_BIN"
          test -x "$AIKO_PORTABLE_NEURON_BIN"
          test -s "$AIKO_PORTABLE_CONTRACT_LIB"
          archive=$(assemble_portable_tarball)
          test -s "$archive"
          sh tests/portable-package-gate.sh
          mkdir -p release-portable
          cp "$archive" release-portable/
          (cd release-portable && (sha256sum *.tar.gz 2>/dev/null || shasum -a 256 *.tar.gz) > SHA256SUMS-${{ matrix.platform }}.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: release-portable/*
          if-no-files-found: error
          retention-days: 30

  # Desktop installers are built natively. Each job normalizes versioned Tauri
  # output to a stable name so /releases/latest/download URLs do not change.
  desktop-linux:
    name: desktop Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aiko/apps/aiko-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: aiko/apps/aiko-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aiko -> target
            aiko/apps/aiko-app/src-tauri -> target
          shared-key: desktop-${{ runner.os }}
      - name: Verify desktop release version
        env:
          AIKO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          AIKO_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        shell: bash
        run: |
          release_version="${AIKO_RELEASE_TAG#v}"
          if test -z "$release_version"; then release_version="$AIKO_RELEASE_VERSION"; fi
          cli_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)
          app_version=$(node -p "require('./aiko/apps/aiko-app/package.json').version")
          tauri_version=$(node -p "require('./aiko/apps/aiko-app/src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/apps/aiko-app/src-tauri/Cargo.toml | head -1)
          test -n "$release_version" && test -n "$cli_version" && test "$app_version" = "$cli_version" && test "$tauri_version" = "$cli_version" && test "$cargo_version" = "$cli_version"
          test "$release_version" = "$cli_version" || {
            echo "Release version $release_version does not match Aiko CLI $cli_version" >&2
            exit 1
          }
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: aiko/apps/aiko-app
        run: pnpm install --frozen-lockfile
      - name: Build runtime and contract
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
      - name: Prepare runtime
        working-directory: aiko/apps/aiko-app
        run: node scripts/prepare-runtime.mjs
      - name: Build Linux bundles
        working-directory: aiko/apps/aiko-app
        run: pnpm exec tauri build --bundles appimage,deb
      - name: Normalize Linux assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t appimages < <(find aiko/target aiko/apps/aiko-app/src-tauri/target -type f -name '*.AppImage' 2>/dev/null | sort)
          mapfile -t debs < <(find aiko/target aiko/apps/aiko-app/src-tauri/target -type f -name '*.deb' 2>/dev/null | sort)
          test "${#appimages[@]}" -gt 0 || { echo 'Expected an AppImage, but Tauri produced none' >&2; exit 1; }
          test "${#debs[@]}" -gt 0 || { echo 'Expected a deb, but Tauri produced none' >&2; exit 1; }
          cp "${appimages[0]}" release-assets/Aiko-Linux-x86_64.AppImage
          cp "${debs[0]}" release-assets/Aiko-Linux-x86_64.deb
          test -s release-assets/Aiko-Linux-x86_64.AppImage
          test -s release-assets/Aiko-Linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  desktop-macos:
    name: desktop macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aiko/apps/aiko-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: aiko/apps/aiko-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aiko -> target
            aiko/apps/aiko-app/src-tauri -> target
          shared-key: desktop-${{ runner.os }}
      - name: Verify desktop release version
        env:
          AIKO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          AIKO_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        shell: bash
        run: |
          release_version="${AIKO_RELEASE_TAG#v}"
          if test -z "$release_version"; then release_version="$AIKO_RELEASE_VERSION"; fi
          cli_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)
          app_version=$(node -p "require('./aiko/apps/aiko-app/package.json').version")
          tauri_version=$(node -p "require('./aiko/apps/aiko-app/src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/apps/aiko-app/src-tauri/Cargo.toml | head -1)
          test -n "$release_version" && test -n "$cli_version" && test "$app_version" = "$cli_version" && test "$tauri_version" = "$cli_version" && test "$cargo_version" = "$cli_version"
          test "$release_version" = "$cli_version" || {
            echo "Release version $release_version does not match Aiko CLI $cli_version" >&2
            exit 1
          }
      - name: Install protoc
        run: brew install protobuf
      - name: Configure macOS signing certificates
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          validate_group() {
            local label="$1"; shift
            local present=0
            for name in "$@"; do
              test -n "${!name:-}" && present=$((present + 1))
            done
            if test "$present" -ne 0 && test "$present" -ne "$#"; then
              echo "$label secrets must be configured all-or-none" >&2
              exit 1
            fi
          }
          validate_group "Apple application certificate" APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          validate_group "Apple installer certificate" APPLE_INSTALLER_CERTIFICATE APPLE_INSTALLER_CERTIFICATE_PASSWORD APPLE_INSTALLER_SIGNING_IDENTITY
          for name in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_INSTALLER_CERTIFICATE APPLE_INSTALLER_CERTIFICATE_PASSWORD APPLE_INSTALLER_SIGNING_IDENTITY; do
            test -n "${!name:-}" || { echo "Required release secret is missing: $name" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/aiko-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "AIKO_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          existing_keychains=$(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$keychain" $existing_keychains
          import_certificate() {
            local encoded="$1" password="$2" name="$3"
            test -n "$encoded" || return 0
            local path="$RUNNER_TEMP/$name.p12"
            printf '%s' "$encoded" | openssl base64 -d -A > "$path"
            security import "$path" -P "$password" -A -t cert -f pkcs12 -k "$keychain"
            rm -f "$path"
          }
          import_certificate "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" application
          import_certificate "$APPLE_INSTALLER_CERTIFICATE" "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" installer
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identities=$(security find-identity -v "$keychain")
          printf '%s\n' "$identities"
          if test -n "$APPLE_SIGNING_IDENTITY"; then
            grep -Fq "$APPLE_SIGNING_IDENTITY" <<< "$identities"
          fi
          if test -n "$APPLE_INSTALLER_SIGNING_IDENTITY"; then
            grep -Fq "$APPLE_INSTALLER_SIGNING_IDENTITY" <<< "$identities"
          fi
      - name: Install frontend dependencies
        working-directory: aiko/apps/aiko-app
        run: pnpm install --frozen-lockfile
      - name: Build runtime and contract
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
      - name: Prepare runtime
        working-directory: aiko/apps/aiko-app
        run: node scripts/prepare-runtime.mjs
      - name: Sign embedded Contract runtime
        working-directory: aiko
        shell: bash
        env:
          AIKO_APP_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$AIKO_APP_SIGNING_IDENTITY" || { echo 'Missing application signing identity' >&2; exit 1; }
          contract_dylib=apps/aiko-app/src-tauri/resources/contract/libcontract.dylib
          test -f "$contract_dylib" || { echo "Missing embedded Contract runtime: $contract_dylib" >&2; exit 1; }
          codesign --force --timestamp --options runtime --sign "$AIKO_APP_SIGNING_IDENTITY" "$contract_dylib"
          codesign --verify --strict --verbose=2 "$contract_dylib"
          codesign --display --verbose=4 "$contract_dylib" 2>&1 | tee "$RUNNER_TEMP/contract-codesign.txt"
          grep -Fq "Authority=$AIKO_APP_SIGNING_IDENTITY" "$RUNNER_TEMP/contract-codesign.txt"
          grep -Fq 'Timestamp=' "$RUNNER_TEMP/contract-codesign.txt"
      - name: Build macOS DMG
        working-directory: aiko/apps/aiko-app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          validate_group() {
            local label="$1"; shift
            local present=0
            for name in "$@"; do
              test -n "${!name:-}" && present=$((present + 1))
            done
            if test "$present" -ne 0 && test "$present" -ne "$#"; then
              echo "$label secrets must be configured all-or-none" >&2
              exit 1
            fi
            if test "$present" -eq 0; then
              for name in "$@"; do unset "$name"; done
            fi
          }
          validate_group "Apple notarization" APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Required macOS release secret is missing: $name" >&2; exit 1; }
          done
          pnpm exec tauri build --bundles app,dmg
      - name: Build and verify macOS product installer
        working-directory: aiko
        shell: bash
        env:
          AIKO_APP_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AIKO_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in AIKO_APP_SIGNING_IDENTITY AIKO_INSTALLER_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Required signed-installer secret is missing: $name" >&2; exit 1; }
          done
          scripts/prep-installer.sh --notarize
          scripts/prep-installer.sh --check
          pkg=$(find dist -maxdepth 1 -type f -name 'Aiko-Installer-*.pkg' | head -1)
          pkgutil --check-signature "$pkg" | grep -Fq "$AIKO_INSTALLER_SIGNING_IDENTITY"
          xcrun stapler validate "$pkg"
      - name: Normalize and verify macOS assets
        shell: bash
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          dmg=$(find aiko/target aiko/apps/aiko-app/src-tauri/target -type f -name '*.dmg' 2>/dev/null | sort | head -n 1)
          test -n "$dmg" || { echo 'Expected a DMG, but Tauri produced none' >&2; exit 1; }
          cp "$dmg" release-assets/Aiko-macOS.dmg
          packages=(aiko/dist/Aiko-Installer-*.pkg)
          archives=(aiko/dist/Aiko-Installer-*.pkg.zip)
          test "${#packages[@]}" -eq 1 && test -f "${packages[0]}" || { echo 'Expected exactly one product pkg' >&2; exit 1; }
          test "${#archives[@]}" -eq 1 && test -f "${archives[0]}" || { echo 'Expected exactly one product pkg zip' >&2; exit 1; }
          cp "${packages[0]}" release-assets/Aiko-macOS.pkg
          cp "${archives[0]}" release-assets/Aiko-macOS.pkg.zip
          for asset in Aiko-macOS.dmg Aiko-macOS.pkg Aiko-macOS.pkg.zip; do
            test -s "release-assets/$asset" || { echo "Missing or empty macOS asset: $asset" >&2; exit 1; }
          done
          rm -rf "$RUNNER_TEMP/aiko-pkg-expanded"
          pkgutil --expand release-assets/Aiko-macOS.pkg "$RUNNER_TEMP/aiko-pkg-expanded"
          test -f "$RUNNER_TEMP/aiko-pkg-expanded/Distribution"
          unzip -tq release-assets/Aiko-macOS.pkg.zip
          test -n "$APPLE_INSTALLER_SIGNING_IDENTITY" || { echo 'Missing Installer signing identity' >&2; exit 1; }
          pkgutil --check-signature release-assets/Aiko-macOS.pkg | tee "$RUNNER_TEMP/pkg-signature.txt"
          grep -Fq "$APPLE_INSTALLER_SIGNING_IDENTITY" "$RUNNER_TEMP/pkg-signature.txt"
          xcrun stapler validate release-assets/Aiko-macOS.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if test -n "${AIKO_SIGNING_KEYCHAIN:-}"; then
            security delete-keychain "$AIKO_SIGNING_KEYCHAIN" || true
          fi

  desktop-windows:
    name: desktop Windows installers
    runs-on: windows-latest
    env:
      # The full Aiko binary exceeds MSVC's PDB public-symbol ceiling (LNK4319).
      # Release installers do not ship debug symbols. Cargo's debug=0 alone still
      # lets rustc pass /DEBUG for public symbols, so explicitly override it at
      # link time while preserving the workspace's Windows target flags.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C force-unwind-tables=yes -C target-feature=+crt-static -C link-arg=/DEBUG:NONE"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aiko/apps/aiko-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: aiko/apps/aiko-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aiko -> target
            aiko/apps/aiko-app/src-tauri -> target
          shared-key: desktop-${{ runner.os }}
      - name: Verify desktop release version
        env:
          AIKO_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          AIKO_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        shell: bash
        run: |
          release_version="${AIKO_RELEASE_TAG#v}"
          if test -z "$release_version"; then release_version="$AIKO_RELEASE_VERSION"; fi
          cli_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)
          app_version=$(node -p "require('./aiko/apps/aiko-app/package.json').version")
          tauri_version=$(node -p "require('./aiko/apps/aiko-app/src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' aiko/apps/aiko-app/src-tauri/Cargo.toml | head -1)
          test -n "$release_version" && test -n "$cli_version" && test "$release_version" = "$cli_version" && test "$app_version" = "$cli_version" && test "$tauri_version" = "$cli_version" && test "$cargo_version" = "$cli_version"
      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc --yes
          protoc --version
      - name: Install frontend dependencies
        working-directory: aiko/apps/aiko-app
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Build runtime and contract
        shell: pwsh
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          cargo build --release --bin aiko --manifest-path aiko/Cargo.toml
      - name: Prepare runtime
        working-directory: aiko/apps/aiko-app
        shell: pwsh
        run: |
          $env:TAURI_ENV_TARGET_TRIPLE = "x86_64-pc-windows-msvc"
          node scripts/prepare-runtime.mjs
      - name: Build Windows MSI and NSIS installers
        working-directory: aiko/apps/aiko-app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $keyPresent = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          $passwordPresent = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if ($keyPresent -ne $passwordPresent) { throw "Tauri updater signing key and password must be configured together" }
          if (-not $keyPresent) {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          pnpm exec tauri build --bundles msi,nsis
      - name: Normalize Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $msi = Get-ChildItem -Recurse -File aiko/target,aiko/apps/aiko-app/src-tauri/target -Filter *.msi -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -First 1
          $setup = Get-ChildItem -Recurse -File aiko/target,aiko/apps/aiko-app/src-tauri/target -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Sort-Object FullName | Select-Object -First 1
          if (-not $msi) { throw "Expected an MSI, but Tauri produced none" }
          if (-not $setup) { throw "Expected an NSIS setup executable, but Tauri produced none" }
          Copy-Item $msi.FullName release-assets/Aiko-Windows-x86_64.msi
          Copy-Item $setup.FullName release-assets/Aiko-Windows-x86_64-Setup.exe
          $appExe = Get-ChildItem -Recurse -File aiko/apps/aiko-app/src-tauri/target -Filter aiko-app.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '[\\/]bundle[\\/]' } | Sort-Object FullName | Select-Object -First 1
          $sidecar = Get-Item aiko/apps/aiko-app/src-tauri/binaries/aiko-x86_64-pc-windows-msvc.exe
          $contract = Get-Item aiko/apps/aiko-app/src-tauri/resources/contract/contract.dll
          if (-not $appExe -or -not $sidecar -or -not $contract) { throw "Portable Aiko app inputs are incomplete" }
          $portableRoot = Join-Path $env:RUNNER_TEMP 'Aiko-Windows-x86_64-Portable'
          New-Item -ItemType Directory -Force (Join-Path $portableRoot 'contract') | Out-Null
          Copy-Item $appExe.FullName (Join-Path $portableRoot 'Aiko.exe')
          Copy-Item $sidecar.FullName (Join-Path $portableRoot 'aiko.exe')
          Copy-Item $contract.FullName (Join-Path $portableRoot 'contract/contract.dll')
          Compress-Archive -Path $portableRoot -DestinationPath release-assets/Aiko-Windows-x86_64-Portable.zip -Force
          $expected = @(
            'Aiko-Windows-x86_64.msi',
            'Aiko-Windows-x86_64-Setup.exe',
            'Aiko-Windows-x86_64-Portable.zip'
          )
          foreach ($name in $expected) {
            $asset = Join-Path release-assets $name
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -eq 0) { throw "Missing or empty release asset: $name" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [zig-cross, cargo-cross, portable, desktop-linux, desktop-macos, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download required desktop assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Download optional Zig CLI assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: zig-*
          path: legacy-assets/zig
          merge-multiple: true
      - name: Download optional Cargo CLI assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: cargo-*
          path: legacy-assets/cargo
          merge-multiple: true
      - name: Download required complete portable stacks
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: legacy-assets/portable
          merge-multiple: true
      - name: Stage, verify, and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' source; do
            name=$(basename "$source")
            case "$name" in
              aiko-*|*.tar.gz|manifest.json|SHA256SUMS-*.txt)
                destination="release-assets/$name"
                if test -e "$destination" && ! cmp -s "$source" "$destination"; then
                  echo "Conflicting legacy release assets named $name" >&2
                  exit 1
                fi
                cp "$source" "$destination"
                ;;
            esac
          done < <(find legacy-assets -type f -print0 2>/dev/null || true)
          expected=(
            Aiko-Linux-x86_64.AppImage
            Aiko-Linux-x86_64.deb
            Aiko-macOS.dmg
            Aiko-macOS.pkg
            Aiko-macOS.pkg.zip
            Aiko-Windows-x86_64.msi
            Aiko-Windows-x86_64-Setup.exe
            Aiko-Windows-x86_64-Portable.zip
          )
          for name in "${expected[@]}"; do
            test -s "release-assets/$name" || { echo "Missing or empty required desktop asset: $name" >&2; exit 1; }
          done
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            mapfile -t matches < <(find release-assets -maxdepth 1 -type f -name "aiko-*-$platform.tar.gz" -printf '%f\n')
            test "${#matches[@]}" -eq 1 || {
              echo "Expected exactly one complete portable archive for $platform, found ${#matches[@]}" >&2
              exit 1
            }
            test -s "release-assets/${matches[0]}"
          done
          mapfile -t files < <(find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort)
          test "${#files[@]}" -ge "${#expected[@]}"
          (cd release-assets && sha256sum -- "${files[@]}" > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
