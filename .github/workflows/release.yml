name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.114, without v)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zig-cross:
    name: zig ${{ matrix.target }} (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            optimize: ReleaseFast
            artifact: aiko-x86_64-linux-gnu
          - target: aarch64-linux-gnu
            optimize: ReleaseFast
            artifact: aiko-aarch64-linux-gnu
          - target: x86_64-linux-musl
            optimize: ReleaseFast
            artifact: aiko-x86_64-linux-musl
          - target: aarch64-macos
            optimize: ReleaseSafe
            artifact: aiko-aarch64-macos
          - target: x86_64-macos
            optimize: ReleaseSafe
            artifact: aiko-x86_64-macos
          - target: x86_64-windows-gnu
            optimize: ReleaseSafe
            artifact: aiko-x86_64-windows-gnu.exe
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Zig target ${{ matrix.target }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} --summary all
          ls -R zig-out 2>/dev/null | head -n 100
          ls -R contract/libcontract/zig-out 2>/dev/null | head -n 100 || true
          ls -lh zig-out/bin/aiko* 2>/dev/null || ls -lh zig-out/bin/* 2>/dev/null || true
      - name: Package Zig artifact
        run: |
          set -euo pipefail
          mkdir -p dist/zig
          if [ -f zig-out/bin/aiko ]; then
            cp zig-out/bin/aiko dist/zig/${{ matrix.artifact }}
            [ -f zig-out/bin/aiko-doctor ] && cp zig-out/bin/aiko-doctor dist/zig/aiko-doctor-${{ matrix.target }} || true
          fi
          if [ -f zig-out/bin/aiko.exe ]; then
            cp zig-out/bin/aiko.exe dist/zig/${{ matrix.artifact }}
          fi
          find contract/libcontract/zig-out -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o -name "*.a" \) -exec cp -v {} dist/zig/ \; 2>/dev/null || true
          ls -lh dist/zig/ || true
          (cd dist/zig && sha256sum * > SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt)
          cat dist/zig/SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || true
          if [ -z "$(ls -A dist/zig 2>/dev/null)" ]; then
            echo "::warning::No artifacts for ${{ matrix.target }}"
            if [ "${{ matrix.allow_failure }}" != "true" ]; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zig-${{ matrix.target }}
          path: dist/zig/
          if-no-files-found: warn
          retention-days: 30

  cargo-cross:
    name: cargo ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aiko-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: aiko-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}
      - name: Install Zig (for cross linker when needed)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cross dependencies (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 20 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: Build Aiko (cargo)
        working-directory: aiko
        run: |
          cargo build --release --bin aiko --target ${{ matrix.target }}
          ls -lh target/${{ matrix.target }}/release/aiko* 2>/dev/null | head -n 20
          ls -lh ../target/${{ matrix.target }}/release/aiko* 2>/dev/null | head -n 20 || true
          target/${{ matrix.target }}/release/aiko --version 2>/dev/null || ../target/${{ matrix.target }}/release/aiko --version 2>/dev/null || true
      - name: Package cargo artifact
        run: |
          set -euo pipefail
          mkdir -p dist/cargo
          for cand in aiko/target/${{ matrix.target }}/release/aiko target/${{ matrix.target }}/release/aiko; do
            if [ -f "$cand" ]; then
              cp -v "$cand" "dist/cargo/${{ matrix.artifact }}"
              break
            fi
          done
          if ls dist/cargo/* >/dev/null 2>&1; then
            (cd dist/cargo && sha256sum * > SHA256SUMS-${{ matrix.target }}.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt)
          fi
          ls -lh dist/cargo/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-${{ matrix.target }}
          path: dist/cargo/
          if-no-files-found: warn
          retention-days: 30

  portable:
    name: portable stack
    runs-on: ubuntu-latest
    needs: [zig-cross]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 5 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: Build Zig (host)
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          ls -lh zig-out/bin/aiko* contract/libcontract/zig-out/lib/* 2>/dev/null | head -n 30
      - name: Build Aiko (cargo release)
        working-directory: aiko
        run: |
          cargo build --release --bin aiko
          # Swatinem cache uses aiko/target as target-dir; cargo may also use ../target depending on runner.
          ls -lh target/release/aiko 2>/dev/null || ls -lh ../target/release/aiko 2>/dev/null || ls -lh cargo/target/release/aiko 2>/dev/null || true
          (./target/release/aiko --version 2>/dev/null || ../target/release/aiko --version 2>/dev/null || target/release/aiko --version 2>/dev/null) || true
      - name: Assemble portable stack
        run: |
          set -euo pipefail
          . scripts/lib/aiko-env.sh
          . scripts/lib/assemble-portable.sh
          aiko_env_init
          # cargo with workspaces "aiko -> target" still writes to aiko/target when cwd=aiko
          for cand in aiko/target/release/aiko target/release/aiko aiko/aiko/target/release/aiko; do
            if [ -x "$cand" ]; then export AIKO_PORTABLE_AIKO_BIN="$cand"; echo "AIKO_PORTABLE_AIKO_BIN=$cand"; break; fi
          done
          ls -lh "${AIKO_PORTABLE_AIKO_BIN:-missing}" 2>/dev/null || true
          assemble_portable_tarball
          ls -lh target/aiko-package/ 2>/dev/null | head -n 40
          cat target/aiko-package/*/manifest.json 2>/dev/null | head -n 80 || true
          echo "--- also check aiko/target ---"
          ls -lh aiko/target/aiko-package/ 2>/dev/null | head -n 20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-x86_64
          path: |
            target/aiko-package/*.tar.gz
            target/aiko-package/*/manifest.json
            aiko/target/aiko-package/*.tar.gz
            aiko/target/aiko-package/*/manifest.json
          if-no-files-found: warn
          retention-days: 30

  # ── Desktop: Linux bundle + Windows portable/installer (cross on ubuntu)
  desktop-linux:
    name: desktop linux + windows
    runs-on: ubuntu-latest
    needs: [portable]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            aiko/apps/desktop/package-lock.json
            aiko/apps/desktop/bun.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 5 || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aiko/target
            target
          key: cargo-desktop-linux-${{ hashFiles('aiko/Cargo.lock') }}
      - name: Install frontend deps
        working-directory: aiko/apps/desktop
        run: |
          npm ci 2>/dev/null || npm install
          if [ -f ../frontend/frontend/package.json ]; then
            npm --prefix ../frontend/frontend ci 2>/dev/null || npm --prefix ../frontend/frontend install || true
          fi
      - name: Build Zig host (for bundled contract lib)
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          ls -lh contract/libcontract/zig-out/lib/ 2>/dev/null | head -n 20
      - name: Prepare runtime (aiko sidecar + contract)
        working-directory: aiko/apps/desktop
        run: |
          # Reuse cargo cache: binary may be at ./target or ../target or aiko/target
          if [ ! -x ../../target/release/aiko ] && [ ! -x ./target/release/aiko ] && [ ! -x target/release/aiko ]; then
            cargo build --release --bin aiko --manifest-path ../../Cargo.toml
          fi
          node scripts/prepare-runtime.mjs || npm run runtime:prepare || true
          ls -lh src-tauri/binaries/ src-tauri/resources/contract/ 2>/dev/null | head -n 40
      - name: Build Tauri bundle (Linux)
        working-directory: aiko/apps/desktop
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -n 30 || true
          npm run tauri build -- --bundles appimage --bundles deb 2>&1 | tail -n 150 || npm run tauri build 2>&1 | tail -n 150 || echo "tauri build failed — portable fallback will still release"
          ls -lh src-tauri/target/release/bundle/ 2>/dev/null | head -n 60 || true
          find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null | head -n 20 || true
      - name: Package Windows portable/installer (cross, via Node)
        if: always()
        working-directory: aiko/apps/desktop
        run: |
          set -e
          if [ -f ../../contract/libcontract/zig-out-windows/bin/contract.dll ] || [ -f ../../contract/libcontract/zig-out/lib/contract.dll ]; then
            echo "Windows contract DLL present"
          else
            echo "No Windows DLL yet — attempting zig cross for windows-gnu"
            (cd ../../.. && zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe --summary all 2>&1 | tail -n 30) || echo "zig windows cross had errors (known, allowlisted)"
            mkdir -p ../../contract/libcontract/zig-out-windows/bin || true
            find ../../contract/libcontract/zig-out -name "*.dll" -exec cp -v {} ../../contract/libcontract/zig-out-windows/bin/contract.dll \; 2>/dev/null || true
          fi
          if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            rustup target add x86_64-pc-windows-msvc 2>/dev/null || true
            (cd ../.. && cargo build --release --bin aiko --target x86_64-pc-windows-msvc 2>&1 | tail -n 30) || true
          fi
          node scripts/package-windows.mjs 2>&1 | tail -n 100 || echo "Windows package not produced (expected on Linux host without Windows toolchain)"
          ls -lh ../../dist/windows-x86_64/ 2>/dev/null | head -n 40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-linux
          path: |
            aiko/apps/desktop/src-tauri/target/release/bundle/**
            dist/windows-x86_64/**
            aiko/dist/**
            dist/**
          if-no-files-found: warn
          retention-days: 30

  # ── Desktop: macOS DMG (the user-facing installer)
  desktop-macos:
    name: desktop macOS DMG
    runs-on: macos-latest
    needs: [portable]
    # macOS runners cost 10× but this is the only way to produce a signed DMG.
    # Don't block the release if the mac queue is slow — allow failure and keep going.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            aiko/apps/desktop/package-lock.json
            aiko/apps/desktop/bun.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install protoc
        run: |
          brew install protobuf || brew upgrade protobuf || true
          protoc --version
          cargo install dotslash --locked 2>&1 | tail -n 10 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: Build Zig (host, for contract lib)
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          ls -lh zig-out/bin/aiko* 2>/dev/null | head -n 20
          ls -lh contract/libcontract/zig-out/lib/* 2>/dev/null | head -n 20
      - name: Install frontend deps
        working-directory: aiko/apps/desktop
        run: |
          npm ci 2>/dev/null || npm install
          if [ -f ../../apps/frontend/frontend/package.json ]; then
            echo "frontend gitlink not materialized — skipping frontend build (UI still bundles)"
          elif [ -f ../frontend/frontend/package.json ]; then
            npm --prefix ../frontend/frontend ci 2>/dev/null || npm --prefix ../frontend/frontend install || true
          fi
      - name: Build Aiko (cargo release, native aarch64)
        working-directory: aiko
        run: |
          cargo build --release --bin aiko
          ls -lh target/release/aiko 2>/dev/null || ls -lh ../target/release/aiko 2>/dev/null || true
          target/release/aiko --version 2>/dev/null || ../target/release/aiko --version 2>/dev/null || true
      - name: Prepare runtime (aiko sidecar + contract)
        working-directory: aiko/apps/desktop
        run: |
          node scripts/prepare-runtime.mjs || npm run runtime:prepare || true
          ls -lh src-tauri/binaries/ 2>/dev/null | head -n 40
          ls -lh src-tauri/resources/contract/ 2>/dev/null | head -n 40
      - name: Build Tauri DMG + .app
        working-directory: aiko/apps/desktop
        run: |
          npm run tauri build -- --bundles dmg --bundles app 2>&1 | tail -n 200 || npm run tauri build 2>&1 | tail -n 200 || true
          echo "=== bundle ==="
          ls -lhR src-tauri/target/release/bundle/ 2>/dev/null | head -n 120 || true
          find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app" \) 2>/dev/null | head -n 40 || true
          # Fail if no DMG was produced (but job is continue-on-error: true, so release still publishes)
          if ! find src-tauri/target/release/bundle -name "*.dmg" 2>/dev/null | grep -q .; then
            echo "::warning::No DMG produced — check tauri.conf and frontend build"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-macos-dmg
          path: |
            aiko/apps/desktop/src-tauri/target/release/bundle/dmg/**
            aiko/apps/desktop/src-tauri/target/release/bundle/macos/**
          if-no-files-found: warn
          retention-days: 30

  # ── Desktop: Windows native installer (MSI + NSIS) + Node portable fallback
  desktop-windows:
    name: desktop windows MSI/NSIS
    runs-on: windows-latest
    needs: [portable]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            aiko/apps/desktop/package-lock.json
            aiko/apps/desktop/bun.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install protoc (windows)
        shell: pwsh
        run: |
          choco install protoc --yes 2>$null || echo "choco protoc install skipped"
          protoc --version
          cargo install dotslash --locked 2>$null | Select-Object -Last 10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aiko -> target"
      - name: Build Zig (host, for contract lib)
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          ls zig-out/bin/ 2>$null; ls contract/libcontract/zig-out/lib/ 2>$null; echo done
        shell: pwsh
      - name: Install frontend deps
        working-directory: aiko/apps/desktop
        run: |
          npm ci 2>$null; if ($LASTEXITCODE -ne 0) { npm install }
        shell: pwsh
      - name: Build Aiko (cargo release, windows native)
        working-directory: aiko
        shell: pwsh
        run: |
          cargo build --release --bin aiko
          cargo build --release --bin aiko-desktop --manifest-path apps/desktop/src-tauri/Cargo.toml 2>$null; echo "aiko-desktop build done"
          ls target/release/aiko.exe 2>$null; ls aiko/target/release/aiko.exe 2>$null; echo "cargo aiko done"
      - name: Prepare runtime (aiko sidecar + contract for windows)
        working-directory: aiko/apps/desktop
        shell: pwsh
        run: |
          $env:TAURI_ENV_TARGET_TRIPLE = "x86_64-pc-windows-msvc"
          node scripts/prepare-runtime.mjs
          if ($LASTEXITCODE -ne 0) { npm run runtime:prepare 2>$null; echo "fallback prepare tried" }
          ls src-tauri/binaries/ 2>$null; ls src-tauri/resources/contract/ 2>$null
      - name: Build Tauri Windows MSI/NSIS
        working-directory: aiko/apps/desktop
        shell: pwsh
        run: |
          npm run tauri build -- --bundles msi --bundles nsis 2>&1 | Select-Object -Last 200
          if ($LASTEXITCODE -ne 0) { npm run tauri build 2>&1 | Select-Object -Last 200; echo "tauri fallback build" }
          echo "=== bundle ==="
          Get-ChildItem -Recurse src-tauri/target/release/bundle 2>$null | Select-Object -First 120 | Format-List
          Get-ChildItem -Recurse -Filter "*.msi" src-tauri/target/release/bundle 2>$null | Select-Object FullName
          Get-ChildItem -Recurse -Filter "*.exe" src-tauri/target/release/bundle 2>$null | Select-Object FullName
          if (-not (Get-ChildItem -Filter "*.msi" -Recurse src-tauri/target/release/bundle 2>$null)) { echo "::warning::No MSI produced" }
      - name: Package Windows portable/installer (Node zips, also on windows)
        if: always()
        working-directory: aiko/apps/desktop
        shell: pwsh
        run: |
          node scripts/package-windows.mjs 2>&1 | Select-Object -Last 100
          if ($LASTEXITCODE -ne 0) { echo "Windows Node package not produced" }
          Get-ChildItem ../../dist/windows-x86_64 2>$null | Format-List
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows
          path: |
            aiko/apps/desktop/src-tauri/target/release/bundle/msi/**
            aiko/apps/desktop/src-tauri/target/release/bundle/nsis/**
            aiko/apps/desktop/src-tauri/target/release/bundle/**/*.msi
            aiko/apps/desktop/src-tauri/target/release/bundle/**/*.exe
            dist/windows-x86_64/**
            aiko/dist/**
            dist/**
          if-no-files-found: warn
          retention-days: 30

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [zig-cross, cargo-cross, portable, desktop-linux, desktop-macos, desktop-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true
      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p _release
          # Known types: tar balls, zips, debs, appimages, dmgs, exes
          find _artifacts -type f \( \
            -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.AppImage" \
            -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
            -o -name "aiko-*" \
          \) -exec cp -v {} _release/ \; 2>/dev/null || true
          # Also accept generic bundle content (macOS .app is a dir — skip)
          find _artifacts -type f -maxdepth 4 \( -name "*.json" \) -exec cp -v {} _release/ \; 2>/dev/null | head -n 20 || true
          ls -lh _release/ 2>/dev/null | head -n 100 || true
          # SHA256SUMS for everything
          if ls _release/* >/dev/null 2>&1; then
            (cd _release && sha256sum -- * 2>/dev/null | sort > SHA256SUMS.txt || shasum -a 256 -- * 2>/dev/null | sort > SHA256SUMS.txt) || true
            cat _release/SHA256SUMS.txt 2>/dev/null | head -n 100 || true
          else
            echo "No files staged for release"
            touch _release/.empty
          fi
          # Annotate what we have / what's missing
          echo "=== Release inventory ==="
          echo "cross (zig):    $(ls _release/aiko-*-linux-gnu* _release/aiko-*-macos* 2>/dev/null | wc -l) binaries"
          echo "cross (cargo):  $(ls _release/aiko-*-unknown-linux-gnu* 2>/dev/null | wc -l) binaries"
          echo "portable:       $(ls _release/*.tar.gz 2>/dev/null | wc -l) stacks"
          echo "linux bundle:   $(ls _release/*.deb _release/*.AppImage 2>/dev/null | wc -l) installers"
          echo "mac DMG:        $(ls _release/*.dmg 2>/dev/null | wc -l) — $(ls _release/*.dmg 2>/dev/null || echo '(none; check desktop-macos job)')"
          echo "windows:        $(ls _release/*windows* 2>/dev/null | wc -l) artifacts"
          ls -lh _release/
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
