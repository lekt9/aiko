name: aiko-webhook-worker

on:
  pull_request:
    paths:
      - "aiko-flow/packages/cloudflare-webhook/**"
      - ".github/workflows/aiko-webhook-worker.yml"
  push:
    branches: [main]
    paths:
      - "aiko-flow/packages/cloudflare-webhook/**"
      - ".github/workflows/aiko-webhook-worker.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Immutable release operation"
        required: true
        default: promote
        type: choice
        options: [dry-run, promote]

permissions:
  contents: read

concurrency:
  group: aiko-webhook-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: aiko-flow/packages/cloudflare-webhook

jobs:
  artifact:
    name: Hermetic Worker artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.0" }
      - uses: pnpm/action-setup@v4
        with: { version: "10.6.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm --dir aiko-flow install --frozen-lockfile
      - run: pnpm --dir aiko-flow --filter @smthrs/cloudflare-webhook typecheck
      - run: pnpm --dir aiko-flow --filter @smthrs/cloudflare-webhook test
      - run: pnpm --dir "$PACKAGE" deploy:dry
      - uses: actions/upload-artifact@v4
        with:
          name: aiko-webhook-${{ github.sha }}
          path: aiko-flow/packages/cloudflare-webhook/dist/release/
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Upload once and stage exact Worker version
    needs: artifact
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'promote')
    runs-on: ubuntu-latest
    environment: aiko-webhook-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AIKO_WEBHOOK_PREVIEW_SMOKE_URL: ${{ vars.AIKO_WEBHOOK_PREVIEW_SMOKE_URL }}
      AIKO_WEBHOOK_STAGING_SMOKE_URL: ${{ vars.AIKO_WEBHOOK_STAGING_SMOKE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: "10.6.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm --dir aiko-flow install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: aiko-webhook-${{ github.sha }}
          path: aiko-flow/packages/cloudflare-webhook/dist/release/
      - name: Refuse missing scoped Cloudflare capability
        run: pnpm --dir "$PACKAGE" deploy:capability
      - name: Upload immutable bytes and smoke preview
        run: pnpm --dir "$PACKAGE" deploy:preview
      - name: Promote receipt to staging without rebuild and smoke
        run: pnpm --dir "$PACKAGE" deploy:staging
      - uses: actions/upload-artifact@v4
        with:
          name: aiko-webhook-staging-${{ github.sha }}
          path: aiko-flow/packages/cloudflare-webhook/dist/release/
          if-no-files-found: error
          retention-days: 90

  production:
    name: Promote exact staged version
    needs: stage
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
    runs-on: ubuntu-latest
    environment: aiko-webhook-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AIKO_WEBHOOK_PRODUCTION_SMOKE_URL: ${{ vars.AIKO_WEBHOOK_PRODUCTION_SMOKE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: "10.6.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm --dir aiko-flow install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: aiko-webhook-staging-${{ github.sha }}
          path: aiko-flow/packages/cloudflare-webhook/dist/release/
      - name: Promote staged version ID at 100 percent without rebuild
        run: pnpm --dir "$PACKAGE" deploy:promote
      - uses: actions/upload-artifact@v4
        with:
          name: aiko-webhook-production-${{ github.sha }}
          path: aiko-flow/packages/cloudflare-webhook/dist/release/receipts/
          if-no-files-found: error
          retention-days: 90
