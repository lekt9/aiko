apiVersion: cell/v0
kind: Cell
metadata:
  name: hello
  description: minimal leaf — inline python (explicit render as banner)
spec:
  membrane:
    inputs: {}
    outputs:
      greeting: { schema: string, render: { type: banner, title: "Greeting" } }
    caps: {}
  run:
    kind: python
    code: |
      def run(inputs, ctx):
          return {"greeting": "hello world"}
