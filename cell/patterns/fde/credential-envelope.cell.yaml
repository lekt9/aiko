apiVersion: cell/v0
kind: Cell
metadata:
  name: credential-envelope
  description: FDE credential lifecycle routed through the OS-vault primitive
spec:
  membrane:
    inputs:
      request: { schema: object }
    outputs:
      result: { schema: object }
      evidence: { schema: object }
    caps:
      os-credential-vault: required
  organelles:
    - { name: vault, cell: ../../primitives/credential-envelope/credential-envelope.cell.yaml }
  wiring:
    - { from: membrane.request, to: vault.request }
    - { from: vault.result, to: membrane.result }
    - { from: vault.evidence, to: membrane.evidence }
