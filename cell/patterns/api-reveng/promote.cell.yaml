apiVersion: cell/v0
kind: Cell
metadata:
  name: unbrowse-promote
  description: observe a read-only web boundary, replay it independently, and promote only on agreement
spec:
  membrane:
    inputs:
      state_dir: { schema: string }
      url: { schema: string }
      credential_env: { schema: string, optional: true }
    outputs:
      boundary: { schema: object }
    caps:
      allow_net: ["*"]
  run:
    kind: python
    entry: ../../adapters/unbrowse/promote.py
