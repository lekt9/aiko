apiVersion: cell/v0
kind: Cell
metadata:
  name: api-reveng
  description: primitive composition demo — session -> auth -> request -> extract
spec:
  membrane:
    inputs:
      base_url: { schema: string }
      credentials: { schema: object }
      path: { schema: string }
    outputs:
      data: { schema: object }
      response: { schema: ../../primitives/schemas/response.v1.json }
    caps: {}
  organelles:
    - name: session
      cell: ../../primitives/session.cell.yaml
    - name: auth
      cell: ../../primitives/auth.cell.yaml
    - name: fetch
      cell: ../../primitives/request.cell.yaml
    - name: extract
      cell: ./extract.cell.yaml
  wiring:
    - from: membrane.base_url
      to: session.base_url
    - from: session.session
      to: auth.session
    - from: membrane.credentials
      to: auth.credentials
    - from: auth.session
      to: fetch.session
    - from: membrane.path
      to: fetch.url
    - from: fetch.response
      to: extract.response
    - from: extract.data
      to: membrane.data
    - from: fetch.response
      to: membrane.response
