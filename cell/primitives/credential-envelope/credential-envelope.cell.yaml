apiVersion: cell/v0
kind: Cell
metadata:
  name: credential-envelope
  description: OS-vault-backed opaque credential lifecycle; raw secrets refused at the Cell membrane
spec:
  membrane:
    inputs:
      request: { schema: object }
    outputs:
      result: { schema: object }
      evidence: { schema: object }
    caps:
      os-credential-vault: required
  run:
    kind: python
    entry: manage.py
