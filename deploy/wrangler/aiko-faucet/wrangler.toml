name = "aiko-faucet"
main = "src/worker.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# IP-rate-limited USDC faucet that auto-pays x402 envelopes on behalf of
# callers within their daily allowance.
#
# Pattern: Manna (Exodus 16:4). One source (the heavens / FAUCET_PRIVATE_KEY),
# daily omer per Israelite (per-IP allowance), no hoarding (KV TTL = 24h),
# enough for each according to need.
#
# Setup:
#   1. Create KV namespace:
#        wrangler kv:namespace create AIKO_FAUCET_KV
#      Paste returned id below.
#   2. Set source wallet secret:
#        wrangler secret put FAUCET_PRIVATE_KEY  # base58 Solana keypair
#   3. Deploy: wrangler deploy
#
# Endpoints:
#   POST /v1/faucet/claim       — request daily allowance (returns x402 receipt)
#   GET  /v1/faucet/balance     — see how much faucet allowance is left for this IP
#   POST /v1/contract/declare   — proxies to Unbrowse, auto-injects x402 if IP has allowance

[vars]
UPSTREAM_BASE = "https://beta-api.unbrowse.ai"
DAILY_LIMIT_USDC = "50"
USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
# SOLANA_RPC is set via `wrangler secret put SOLANA_RPC` so the URL (which
# carries the Helius API key inline) never lands in this checked-in file.
# Public RPC (api.mainnet-beta.solana.com) blocks Cloudflare Workers IP
# ranges with 403, so a managed RPC (Helius / QuickNode / Alchemy) is
# mandatory for this worker to function.

# Sliding-window rate limit per IP. Default: max 10 declares/hour.
# Sliding window means tokens refill continuously — not a daily reset.
HOURLY_LIMIT = "10"
WINDOW_SECONDS = "3600"
# Legacy claim TTL (still used by /v1/faucet/claim for one-time USDC drop).
TTL_SECONDS = "86400"

[[kv_namespaces]]
binding = "AIKO_FAUCET_KV"
id = "73be6aa35e49400db54e20cf2f74c651"

# Required secrets (`wrangler secret put <NAME>`):
#   FAUCET_PRIVATE_KEY    base58 Solana keypair (64 bytes) — owns the escrow + session key
#   FLEX_ESCROW_ADDRESS   escrow PDA returned by scripts/setup-flex-escrow.ts
