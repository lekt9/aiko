name = "aiko-declare-proxy"
main = "src/worker.ts"
compatibility_date = "2025-01-15"

# This Worker fronts https://beta-api.unbrowse.ai/v1/contract/declare and
# adds the reliability the substrate canon demands but the raw endpoint
# doesn't ship: idempotency-key, exponential-backoff retries on 5xx, 30s
# timeout, and a circuit breaker that fails fast when upstream is brown.
#
# Deploy:
#   cd deploy/wrangler/aiko-declare-proxy && wrangler deploy
# Then point UNBROWSE_BASE at the worker URL.

[vars]
UPSTREAM_BASE = "https://beta-api.unbrowse.ai"
MAX_RETRIES = "3"
RETRY_BACKOFF_MS = "400"
TIMEOUT_MS = "30000"
